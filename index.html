<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7c3aed">
    <meta name="description" content="NoteDesk のローカル専用入口">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="NoteDesk">
    <title>NoteDesk | Local Safe</title>
    <link rel="manifest" href="manifest.webmanifest?v=24">
    <link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png?v=2">
    <link rel="stylesheet" href="styles.css?v=24">
  </head>
  <body>
    <section class="login-screen" aria-labelledby="local-safe-title">
      <div class="login-card">
        <p class="eyebrow">NoteDesk</p>
        <h1 id="local-safe-title">ローカル専用ノート</h1>
        <p class="login-note">ログインなしで、このブラウザ内だけにノートを保存します。安全モードでは軽量AIのみを使い、クラウド同期や高性能AIのモデル読込を行いません。</p>
        <div class="login-form">
          <button type="button" class="local-trial-button" id="startLocalSafeButton">安全モードで開く</button>
          <p class="login-note local-mode-note">ブラウザのサイトデータを削除すると、ローカルノートも削除されることがあります。</p>
        </div>
      </div>
    </section>

    <script>
      const LOCAL_MODE_KEY = "note-desk-local-mode";
      const LOCAL_ENTRY_KEY = "note-desk-local-entry";
      const SAFE_MODE_KEY = "note-desk-safe-mode";
      const AI_MODE_KEY = "note-desk-ai-mode";

      function enterLocalSafeMode() {
        localStorage.setItem(LOCAL_MODE_KEY, "true");
        localStorage.setItem(LOCAL_ENTRY_KEY, "true");
        localStorage.setItem(SAFE_MODE_KEY, "true");
        localStorage.setItem(AI_MODE_KEY, "light");
        window.location.href = "memo.html";
      }

      document.querySelector("#startLocalSafeButton").addEventListener("click", enterLocalSafeMode);
    </script>
    <script src="pwa.js?v=24"></script>
  </body>
</html>
